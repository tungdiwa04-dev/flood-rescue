<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>CONTROL PANEL</title>

<style>
body{
  font-family:sans-serif;
  background:#f5f5f5;
  padding:10px;
}

.topbar{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

input{
  flex:1;
  padding:10px;
}

button.back{
  background:#333;
  color:white;
  border:none;
  padding:10px;
  border-radius:5px;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th, td{
  border:1px solid #ddd;
  padding:8px;
  font-size:14px;
}

th{
  background:#222;
  color:white;
}

img{
  width:80px;
  border-radius:5px;
}

button{
  padding:5px 8px;
  margin:2px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.approve{
  background:green;
  color:white;
}

.reject{
  background:red;
  color:white;
}

.view{
  background:#2196f3;
  color:white;
}
</style>
</head>

<body>

<h2>🛠 CONTROL PANEL</h2>

<!-- 🔝 บนสุด -->
<div class="topbar">

  <button class="back" onclick="location.href='admin.html'">
    ⬅ กลับแอดมิน
  </button>

  <input id="searchInput" placeholder="ค้นหา ชื่อ / เลขอาสา / มูลนิธิ / พื้นที่">

</div>

<table>
<thead>
<tr>
  <th>ชื่อ</th>
  <th>เลขอาสา</th>
  <th>นามเรียกขาน</th>
  <th>มูลนิธิ</th>
  <th>พื้นที่</th>
  <th>รูป</th>
  <th>สถานะ</th>
  <th>จัดการ</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  update
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "help-people-38dfd.firebaseapp.com",
  databaseURL: "https://help-people-38dfd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "help-people-38dfd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const verifyRef = ref(db,"verificationRequests");

let dataCache = {};

/* โหลด realtime */
onValue(verifyRef,(snap)=>{
  dataCache = snap.val() || {};
  render();
});

/* render ตาราง */
function render(){

  const search = document.getElementById("searchInput").value.trim();
  const tbody = document.getElementById("tableBody");

  tbody.innerHTML = "";

  for(let id in dataCache){

    const v = dataCache[id];

    const text = `
      ${v.name||""}
      ${v.idCard||""}
      ${v.callSign||""}
      ${v.foundation||""}
      ${v.area||""}
    `;

    if(search && !text.includes(search)) continue;

    tbody.innerHTML += `
      <tr>
        <td>${v.name||"-"}</td>
        <td>${v.idCard||"-"}</td>
        <td>${v.callSign||"-"}</td>
        <td>${v.foundation||"-"}</td>
        <td>${v.area||"-"}</td>

        <td>
          <button class="view"
            onclick="window.open('${v.image}')">
            ดูรูป
          </button>
        </td>

        <td>
          ${v.status || "pending"}
          <br>
          ${v.status === "approved" ? "🟢 อนุมัติแล้ว" : ""}
          ${v.status === "rejected" ? "🔴 ไม่อนุมัติ" : ""}
        </td>

        <td>
          <button class="approve"
            onclick="approveUser('${id}')">
            ✔ ยืนยัน
          </button>

          <button class="reject"
            onclick="rejectUser('${id}')">
            ✖ ไม่ยืนยัน
          </button>
        </td>
      </tr>
    `;
  }
}

/* ค้นหา realtime */
document.getElementById("searchInput").addEventListener("input", render);

/* ✔ ยืนยัน */
window.approveUser = function(id){
  update(ref(db,"verificationRequests/"+id),{
    status:"approved",
    verified:true
  });
};

/* ✖ ไม่ยืนยัน (ไม่ลบข้อมูล) */
window.rejectUser = function(id){
  update(ref(db,"verificationRequests/"+id),{
    status:"rejected",
    verified:false
  });
};

</script>

</body>
</html>

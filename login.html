<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบอาสา</title>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
  background: #f5f5f5;
}

.box {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}
</style>
</head>

<body>

<h2>🚑 ระบบอาสา</h2>

<!-- ================= อาสา ================= -->
<div class="box">
  <h3>ส่งข้อมูลอาสา</h3>

  <input id="idCard" placeholder="เลขอาสา">
  <input id="foundation" placeholder="มูลนิธิ">
  <input id="area" placeholder="พื้นที่">
  <input id="name" placeholder="ชื่อ">
  <input id="callSign" placeholder="นามเรียกขาน">
  <input type="file" id="cardImage">

  <button onclick="sendVolunteer()">ส่งข้อมูล</button>
</div>

<!-- ================= แอดมิน ================= -->
<div class="box">
  <h3>🛠 แอดมิน</h3>

  <input id="adminUser" placeholder="ชื่อแอดมิน">
  <input id="adminPass" type="password" placeholder="รหัสผ่าน">

  <button onclick="loginAdmin()">เข้าสู่แอดมิน</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase,
  ref,
  push
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "help-people-38dfd.firebaseapp.com",
  databaseURL: "https://help-people-38dfd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "help-people-38dfd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= ส่งข้อมูลอาสา ================= */
window.sendVolunteer = async function () {

  const file = document.getElementById("cardImage").files[0];

  if (!file) {
    alert("กรุณาใส่รูป");
    return;
  }

  const reader = new FileReader();

  reader.onload = async function () {

    try {

      await push(ref(db, "verificationRequests"), {
        idCard: document.getElementById("idCard").value,
        foundation: document.getElementById("foundation").value,
        area: document.getElementById("area").value,
        name: document.getElementById("name").value,
        callSign: document.getElementById("callSign").value,
        image: reader.result,
        status: "pending",
        verified: false,
        time: Date.now()
      });

      alert("✔ ส่งข้อมูลสำเร็จ");

      // ไปหน้า control.html
      window.location.href = "control.html";

    } catch (error) {

      console.error(error);
      alert("❌ ส่งข้อมูลไม่สำเร็จ");

    }

  };

  reader.readAsDataURL(file);
};

/* ================= login admin ================= */
window.loginAdmin = function () {

  const user = document.getElementById("adminUser").value.trim();
  const pass = document.getElementById("adminPass").value.trim();

  if (user === "TT1225" && pass === "1") {

    window.location.href = "admin.html";

  } else {

    alert("❌ login ไม่ถูกต้อง");

  }
};

</script>

};

</script>

</body>
</html>

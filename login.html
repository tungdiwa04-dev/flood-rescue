<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบอาสา</title>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
  background: #f5f5f5;
}

.box {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}
</style>
</head>

<body>

<h2>🚑 ระบบอาสา</h2>

<!-- ================= อาสา ================= -->
<div class="box">
  <h3>ส่งข้อมูลอาสา</h3>

  <input id="idCard" placeholder="เลขอาสา">
  <input id="foundation" placeholder="มูลนิธิ">
  <input id="area" placeholder="พื้นที่">
  <input id="name" placeholder="ชื่อ">
  <input id="callSign" placeholder="นามเรียกขาน">
  <input type="file" id="cardImage">

  <button onclick="sendVolunteer()">ส่งข้อมูล</button>
</div>

<!-- ================= แอดมิน ================= -->
<div class="box">
  <h3>🛠 แอดมิน</h3>

  <input id="adminUser" placeholder="ชื่อแอดมิน">
  <input id="adminPass" type="password" placeholder="รหัสผ่าน">

  <button onclick="loginAdmin()">เข้าสู่แอดมิน</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "help-people-38dfd.firebaseapp.com",
  databaseURL: "https://help-people-38dfd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "help-people-38dfd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= ส่งข้อมูลอาสา ================= */
window.sendVolunteer = function () {

  const file = document.getElementById("cardImage").files[0];
  if (!file) return alert("กรุณาใส่รูป");

  const reader = new FileReader();

  reader.onload = function () {

    push(ref(db, "verificationRequests"), {
      idCard: idCard.value,
      foundation: foundation.value,
      area: area.value,
      name: name.value,
      callSign: callSign.value,
      image: reader.result,
      status: "pending",
      verified: false,
      time: Date.now()
    });

    alert("✔ ส่งข้อมูลแล้ว");
  };

  reader.readAsDataURL(file);
};

/* ================= login admin ================= */
window.loginAdmin = function () {

  const user = document.getElementById("adminUser").value.trim();
  const pass = document.getElementById("adminPass").value.trim();

  if (user === "admin" && pass === "16022554TTT") {

    // 🔥 เข้าหลังบ้าน
    window.location.href = "admin.html";

  } else {
    alert("❌ login ไม่ถูกต้อง");
  }
};

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ล็อกอินอาสา</title>

<style>
body {
  font-family:sans-serif;
  padding:20px;
  background:#f5f5f5;
}

input, button {
  margin:5px 0;
  padding:10px;
  width:100%;
}

.box {
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}
</style>
</head>

<body>

<h2>ระบบเข้าสู่ระบบ</h2>

<!-- ================= อาสา ================= -->
<div class="box">
<h3>ส่งข้อมูลอาสา</h3>

<input type="text" id="idCard" placeholder="เลขอาสา" required>

<input type="text" id="foundation" placeholder="มูลนิธิ" required>

<input type="text" id="area" placeholder="พื้นที่" required>

<input type="text" id="name" placeholder="ชื่อ" required>

<input type="text" id="callSign" placeholder="นามเรียกขาน" required>

<input type="file" id="cardImage" accept="image/*" required>

<button onclick="sendVolunteer()">ส่งข้อมูล</button>
</div>

<!-- ================= แอดมิน ================= -->
<div class="box">
<h3>ล็อกอินแอดมิน</h3>

<input type="text" id="adminUser" placeholder="ชื่อแอดมิน">

<input type="password" id="adminPass" placeholder="รหัสผ่าน">

<button onclick="loginAdmin()">เสร็จสิ้น</button>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getDatabase,
  ref,
  push
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* firebase */
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "help-people-38dfd.firebaseapp.com",
  databaseURL: "https://help-people-38dfd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "help-people-38dfd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ส่งข้อมูลอาสา */
window.sendVolunteer = function() {

  const idCard =
    document.getElementById("idCard").value.trim();

  const foundation =
    document.getElementById("foundation").value.trim();

  const area =
    document.getElementById("area").value.trim();

  const name =
    document.getElementById("name").value.trim();

  const callSign =
    document.getElementById("callSign").value.trim();

  const file =
    document.getElementById("cardImage").files[0];

  if (
    !idCard ||
    !foundation ||
    !area ||
    !name ||
    !callSign ||
    !file
  ) {
    alert("กรอกข้อมูลให้ครบ");
    return;
  }

  const reader = new FileReader();

  reader.onload = function() {

    push(ref(db, "verificationRequests"), {

      idCard,
      foundation,
      area,
      name,
      callSign,

      image: reader.result,

      status: "pending",

      time: Date.now()

    });

    alert("ส่งข้อมูลเรียบร้อย รอแอดมินตรวจสอบ");

    window.location.href = "index.html";
  };

  reader.readAsDataURL(file);
};

/* ล็อกอินแอดมิน */
window.loginAdmin = function() {

  const user =
    document.getElementById("adminUser").value.trim();

  const pass =
    document.getElementById("adminPass").value.trim();

  if (
    user === "admin" &&
    pass === "16022554TTT"
  ) {

    window.location.href = "admin.html";

  } else {

    alert("❌ ชื่อหรือรหัสผ่านไม่ถูกต้อง");

  }
};

</script>

</body>
</html>
